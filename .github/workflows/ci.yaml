name: Python CI

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
  pull_request:
    branches:
      - main
  
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Python version
        run: python --version

      - name: Show operating system
        run: uname -a
      
      - name: Show current user
        run: whoami
      
      - name: Show current directory
        run: pwd
      
      - name: List files
        run: ls -la
        